name: Runtime Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python3 scripts/validate_runtime_integrity.py --receipt /tmp/runtime-integrity-receipt.json
      - run: python3 -m unittest discover -s tests -v
      - name: Upload redacted validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-integrity-receipt
          path: /tmp/runtime-integrity-receipt.json
          if-no-files-found: error
