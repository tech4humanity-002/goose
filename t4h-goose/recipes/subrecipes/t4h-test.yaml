version: "1.0.0"
title: "T4H Test and Verify"
description: "Run the narrowest relevant tests and report concrete evidence."
parameters:
  - key: objective
    input_type: string
    requirement: required
    description: "Change or outcome to verify."
instructions: |
  Verify: {{ objective }}.
  Run the narrowest relevant tests/checks available. If a check fails, diagnose and retry using the next known safe method. Report commands/checks, results and remaining blockers. Never claim success without evidence.
prompt: "Test and verify: {{ objective }}"
settings:
  max_turns: 40
