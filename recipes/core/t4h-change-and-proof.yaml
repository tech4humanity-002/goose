version: "1.2.0"
title: "T4H Change and Proof"
description: "Generic governed workflow for making a change and proving the resulting outcome."
parameters:
  - key: request
    input_type: string
    requirement: required
    description: "Requested change."
  - key: idempotency_key
    input_type: string
    requirement: optional
    description: "Stable replay-protection key."
sub_recipes:
  - name: inspect
    path: "../subrecipes/t4h-inspect.yaml"
    description: "Inspect before mutation."
    values:
      objective: "{{ request }}"
  - name: proof
    path: "../subrecipes/t4h-proof-check.yaml"
    description: "Verify the final outcome."
    values:
      outcome: "{{ request }}"
instructions: |
  Execute the requested change: {{ request }}.
  Inspect first. Make only necessary changes. Verify after mutation. Require approval for external, infrastructure, destructive, secret, deployment or financial effects. Finish only with evidence.
  Before mutation derive or record an idempotency key, check prior receipts, capture recoverable pre-change state and suppress duplicate completed actions. On failure, retry within the declared budget, recover the pre-change state when safe, and emit the structured result contract.
prompt: "Execute and prove: {{ request }}"
settings:
  max_turns: 100
retry:
  max_retries: 2
  timeout_seconds: 600
  backoff_seconds: [2, 10]
  recovery: invoke_t4h_rollback
