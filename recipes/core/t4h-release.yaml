version: "1.0.0"
title: "T4H Release"
description: "Governed release workflow composed from build, proof and release checks."
parameters:
  - key: release_request
    input_type: string
    requirement: required
    description: "Release request."
sub_recipes:
  - name: build
    path: "../development/t4h-build-and-verify.yaml"
    description: "Build and verify the requested release change."
    values:
      request: "{{ release_request }}"
  - name: proof
    path: "../subrecipes/t4h-proof-check.yaml"
    description: "Prove the release outcome."
    sequential_when_repeated: true
instructions: |
  Execute a governed T4H release for: {{ release_request }}.
  Build and verify first. Require explicit approval before deployment or other external effects. Complete final proof before reporting release success.
prompt: "Release: {{ release_request }}"
settings:
  max_turns: 120
