version: "1.0.0"
title: "T4H Task Lifecycle"
description: "Create, claim and complete a bounded T4H task with ownership and verification."
parameters:
  - key: task_request
    input_type: string
    requirement: required
    description: "Bounded task to execute."
instructions: |
  Execute the bounded task: {{ task_request }}. Use CREATE → CLAIM → EXECUTE → COMPLETE. Record task identifier and owner. Do not claim completion without checking actual result. If failure/retry/dependency semantics are required but not exposed, mark the gap explicitly.
prompt: "Execute the T4H task lifecycle for {{ task_request }}."
settings:
  max_turns: 75
