version: "1.2.0"
title: "T4H Proof Check"
description: "Perform a final proof check before a workflow claims completion."
parameters:
  - key: outcome
    input_type: string
    requirement: required
    description: "Outcome that must be proven."
instructions: |
  Prove the outcome: {{ outcome }}.
  Separate execution evidence, result evidence and authorisation evidence. Return PASS, WARN, BLOCKED or UNPROVEN with the evidence used.
prompt: "Prove this outcome: {{ outcome }}"
settings:
  max_turns: 30
