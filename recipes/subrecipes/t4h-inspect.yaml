version: "1.0.0"
title: "T4H Inspect Workspace"
description: "Inspect the current workspace and identify relevant files, state and available verification paths."
parameters:
  - key: objective
    input_type: string
    requirement: required
    description: "Objective being investigated."
instructions: |
  Inspect the workspace for the objective: {{ objective }}.
  Read relevant instructions first. Identify the repository, changed files, relevant implementation, tests and verification mechanisms. Do not mutate anything.
prompt: "Inspect the workspace for: {{ objective }}"
settings:
  max_turns: 30
