version: "1.2.0"
title: "T4H Build and Verify"
description: "Inspect a development task, implement it, test it, and prove the resulting state."
parameters:
  - key: request
    input_type: string
    requirement: required
    description: "Development request."
  - key: idempotency_key
    input_type: string
    requirement: optional
    description: "Stable key used to detect replay of the same requested change."
sub_recipes:
  - name: inspect
    path: "../subrecipes/t4h-inspect.yaml"
    description: "Inspect repository and relevant implementation before editing."
    values:
      objective: "{{ request }}"
  - name: test
    path: "../subrecipes/t4h-test.yaml"
    description: "Run relevant tests and checks after implementation."
    values:
      objective: "{{ request }}"
  - name: proof
    path: "../subrecipes/t4h-proof-check.yaml"
    description: "Prove the final outcome."
    values:
      outcome: "{{ request }}"
instructions: |
  Complete this development request: {{ request }}.
  Use inspect first, then implement the smallest correct change, then test, then proof.
  Fix failures using the next known safe method. Preserve changed-file and verification evidence. Do not claim completion without proof.
  Derive or record an idempotency key before mutation, check for an existing successful receipt, and do not repeat a completed side effect. Enforce the retry/timeout contract below. On exhausted retries, restore the pre-change state when safe and return a structured BLOCKED or DEGRADED result with recovery details.
prompt: "Implement and verify: {{ request }}."
settings:
  max_turns: 100
retry:
  max_retries: 2
  timeout_seconds: 300
  backoff_seconds: [2, 10]
  recovery: restore_pre_change_state
  checks:
    - type: shell
      command: "git diff --check"
