schema_version: 1.0.0
contract_version: 1.4.0
id: t4h-build-and-verify
title: T4H Build and Verify
category: development
purpose: Implement, test and prove a development request.
parameters:
- key: request
  input_type: string
  requirement: required
  description: Development request.
- key: idempotency_key
  input_type: string
  requirement: optional
  description: Stable key used to detect replay of the same requested change.
capabilities:
- filesystem
- git
- developer
- tests
steps:
- workflow: t4h-inspect
  bindings:
    objective: '{{ request }}'
  description: Inspect repository and relevant implementation before editing.
- workflow: t4h-test
  bindings:
    objective: '{{ request }}'
  description: Run relevant tests and checks after implementation.
- workflow: t4h-proof-check
  bindings:
    outcome: '{{ request }}'
  description: Prove the final outcome.
instructions: 'Complete this development request: {{ request }}.

  Use inspect first, then implement the smallest correct change, then test, then proof.

  Fix failures using the next known safe method. Preserve changed-file and verification evidence. Do not claim completion
  without proof.

  Derive or record an idempotency key before mutation, check for an existing successful receipt, and do not repeat a completed
  side effect. Enforce the retry/timeout contract below. On exhausted retries, restore the pre-change state when safe and
  return a structured BLOCKED or DEGRADED result with recovery details.

  '
execution:
  max_turns: 100
  retry:
    max_retries: 2
    timeout_seconds: 300
    backoff_seconds:
    - 2
    - 10
    recovery: restore_pre_change_state
    checks:
    - type: shell
      command: git diff --check
outputs:
- changed-files
- test-results
- proof-status
- structured-result
- receipt
limitations:
- External changes require approval and live tools

