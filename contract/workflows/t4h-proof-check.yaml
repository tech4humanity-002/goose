schema_version: 1.0.0
contract_version: 1.3.0
id: t4h-proof-check
title: T4H Proof Check
category: subrecipe
purpose: Perform final proof before completion.
parameters:
- key: outcome
  input_type: string
  requirement: required
  description: Outcome that must be proven.
capabilities:
- proof-tools-if-configured
steps: []
instructions: 'Prove the outcome: {{ outcome }}.

  Separate execution evidence, result evidence and authorisation evidence. Return PASS, WARN, BLOCKED or UNPROVEN with the
  evidence used.

  '
execution:
  max_turns: 30
  retry:
    max_retries: 0
    timeout_seconds: 300
    backoff_seconds: []
    recovery: report_blocked
outputs:
- proof-status
- structured-result
limitations:
- External proof depends on live evidence tools

