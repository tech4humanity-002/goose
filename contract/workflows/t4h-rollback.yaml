schema_version: 1.0.0
contract_version: 1.3.0
id: t4h-rollback
title: T4H Rollback and Recovery
category: recovery
purpose: Restore and prove a trusted pre-change state.
parameters:
- key: failed_change
  input_type: string
  requirement: required
  description: Failed or unsafe change requiring recovery.
- key: recovery_target
  input_type: string
  requirement: required
  description: Proven revision, snapshot or state to restore.
- key: idempotency_key
  input_type: string
  requirement: optional
  description: Stable rollback replay-protection key.
capabilities:
- workspace
- snapshots
- deployment
- proof
steps:
- workflow: t4h-inspect
  bindings:
    objective: Rollback {{ failed_change }} to {{ recovery_target }}
  description: Confirm the failure and recovery target before mutation.
- workflow: t4h-proof-check
  bindings:
    outcome: Recovered {{ failed_change }} to {{ recovery_target }}
  description: Verify the restored state.
instructions: 'Recover from {{ failed_change }} by restoring {{ recovery_target }}. Verify that the target exists and is trusted.
  Record or derive an idempotency key and check for a prior successful rollback. Require approval when recovery has external,
  destructive or infrastructure effects. Preserve failure evidence. Apply the narrowest reversible recovery, verify service
  and data state, and emit structured result and receipt records. If recovery cannot be proven, quarantine the affected resource
  and return BLOCKED with a named owner and next action.

  '
execution:
  max_turns: 100
  retry:
    max_retries: 1
    timeout_seconds: 900
    backoff_seconds:
    - 10
    recovery: quarantine_and_escalate
outputs:
- recovery-status
- proof-status
- structured-result
- receipt
limitations:
- External rollback requires approval and a valid target

